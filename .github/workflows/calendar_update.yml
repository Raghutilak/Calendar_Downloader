name: Calendar Downloader
permissions:
  contents: write


on:
  workflow_dispatch:

  schedule:

    # - cron: '0 0 * * *'   # Daily at 00:00 UTC

    # - cron: '0 0 * * 0'   # Weekly at 00:00 UTC on Sunday

    - cron: '0 0 1 * *'     # Monthly at 00:00 UTC on the 1st day


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python version
        run: python --version

      - name: Show project files
        run: ls -R

      - name: Show config.py
        run: cat src/config.py

      - name: Show build_all.py
        run: head -40 src/build_all.py

      - name: Run downloader
        run: python src/build_all.py

# Commit update Calendar_Data if anything changed.

      - name: Commit updated Calendar_Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Calendar_Data

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Calendar_Data"
          fi

      - name: Push changes
        if: success()
        run: git push
    
