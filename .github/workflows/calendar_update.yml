name: Calendar Downloader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python version
        run: python --version

      - name: Show project files
        run: ls -R

      - name: Show config.py
        run: cat src/config.py

      - name: Show build_all.py
        run: head -40 src/build_all.py

      - name: Run downloader
        run: python src/build_all.py

      - name: Upload Calendar_Data
        uses: actions/upload-artifact@v4
        with:
          name: Calendar_Data
          path: Calendar_Data
